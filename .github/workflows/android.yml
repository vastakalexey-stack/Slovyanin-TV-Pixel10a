name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Download approved intro video from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check gdown==5.2.0
          mkdir -p app/src/main/res/raw
          gdown --fuzzy 'https://drive.google.com/file/d/1Ksf26cjRW671X3O3Fkugx1OHwemepIYl/view?usp=drivesdk' -O app/src/main/res/raw/intro.mp4
          test -s app/src/main/res/raw/intro.mp4
          file app/src/main/res/raw/intro.mp4
      - name: Verify bundled intro video
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/raw/intro.mp4
          file app/src/main/res/raw/intro.mp4
          ls -lh app/src/main/res/raw/intro.mp4
      - name: Configure and validate persistent release signing
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is missing."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/slovyanin-release.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          echo "SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Slovyanin-TV-1.4.9.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Slovyanin-TV-1.4.9
          path: dist/Slovyanin-TV-1.4.9.apk
          if-no-files-found: error
          retention-days: 14
